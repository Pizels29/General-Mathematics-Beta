name: general-mathematics
region: us-east-1
yamlVersion: 2

backend:
  path: ./
  language:
    name: js
    packageManager: npm
  functions:
    - name: proxy-server
      path: ./
      entry: index.js
      type: httpServer
  scripts:
    deploy:
      - git submodule update --init --recursive
      - npm install
